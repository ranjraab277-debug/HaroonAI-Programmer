<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haroon AI Agent V3</title><style>
:root{--bg:#080b14;--panel:#0e1422;--panel2:#121a2b;--line:#24304a;--text:#eef3ff;--muted:#8d9ab8;--accent:#6d8cff;--ok:#35d39a;--danger:#ff647c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -20%,#172449 0,#080b14 45%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:68px;border-bottom:1px solid var(--line);background:#0b101cdd;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#718cff,#8c6cff);display:grid;place-items:center}.account{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#1a2438}.pill{font-size:12px;padding:5px 9px;border-radius:999px;background:#172038;color:var(--muted)}.online{color:var(--ok)}button,input{font:inherit}button{border:0;cursor:pointer}.btn{border-radius:12px;padding:10px 13px;background:var(--accent);color:white;font-weight:800}.btn.secondary{background:#1a2438}.btn.danger{background:#3a1822;color:#ff9cac}.layout{flex:1;display:flex;min-height:calc(100vh - 68px)}aside{width:275px;background:#0b111e;border-left:1px solid var(--line);padding:13px}.new{width:100%;margin-bottom:12px}.chat{width:100%;text-align:right;color:#d9e2f8;background:transparent;border-radius:11px;padding:11px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat.active{background:#17233c}.main{flex:1;min-width:0;display:flex;flex-direction:column}.hero{max-width:900px;width:100%;margin:auto;padding:50px 22px 10px;text-align:center}.hero h1{margin:0 0 9px;font-size:38px}.hero p{color:var(--muted);margin:0}.status{display:inline-flex;gap:7px;align-items:center;margin-top:16px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#0d1423;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#777}.dot.ok{background:var(--ok)}.messages{flex:1;overflow:auto;padding:15px 20px 120px}.msg{max-width:850px;margin:10px auto;padding:14px 16px;border:1px solid var(--line);border-radius:17px;white-space:pre-wrap;line-height:1.7}.user{background:#142444}.assistant{background:#0f1728}.activity{font-size:12px;color:var(--muted);margin-top:10px}.composer{position:sticky;bottom:0;display:flex;gap:9px;padding:14px;border-top:1px solid var(--line);background:#080b14ee;backdrop-filter:blur(10px)}.composer input{flex:1;min-width:0;background:#0d1526;border:1px solid var(--line);outline:0;color:white;border-radius:14px;padding:14px}.login{position:fixed;inset:0;background:#050711ee;z-index:20;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#101827;border:1px solid var(--line);border-radius:24px;padding:27px;text-align:center;box-shadow:0 20px 80px #0008}.card h2{font-size:29px;margin:0 0 7px}.card p{color:var(--muted);line-height:1.6}.rbx{width:100%;margin-top:9px;background:#e45b8b}.small{font-size:12px;color:var(--muted)}@media(max-width:750px){aside{display:none}.hero{padding-top:35px}.hero h1{font-size:30px}.top{padding:0 11px}.account .name{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">H</div><span>Haroon AI</span><span class="pill">Agent V3</span></div><div id="account" class="account"></div></header><div class="layout"><aside><button class="btn new" onclick="newChat()">＋ محادثة جديدة</button><div id="chatList"></div></aside><main class="main"><section class="hero"><h1>Haroon AI</h1><p>وكيل برمجة Roblox يفهم طلبك ويبني خطة تنفيذ للمشروع.</p><div class="status"><span id="dot" class="dot"></span><span id="agentStatus">Agent غير متصل</span></div></section><div id="messages" class="messages"></div><div class="composer"><input id="input" placeholder="مثلاً: أنشئ نظام Checkpoints كامل..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"><button class="btn" onclick="send()">إرسال</button></div></main></div></div><div id="login" class="login"><div class="card"><h2>Haroon AI</h2><p>أنشئ حساب Haroon AI مرتبطًا بحساب Roblox. لا تكتب كلمة مرور Roblox داخل التطبيق.</p><button class="btn rbx" onclick="location.href='/auth/roblox?mode=create'">Create Account with Roblox</button><button class="btn secondary rbx" onclick="location.href='/auth/roblox?mode=login'">Login with Roblox</button><p class="small">تسجيل الدخول يستخدم Roblox OAuth 2.0.</p></div></div><script>
let me=null,currentChat=null,jobTimer=null;const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function boot(){try{const d=await api('/api/me');if(!d.loggedIn){$('login').style.display='grid';return}$('login').style.display='none';me=d.user;renderAccount();await loadChats();await statusLoop()}catch(e){console.error(e)}}
function renderAccount(){$('account').innerHTML=`<img class="avatar" src="${me.avatar_url||''}" alt=""><div class="name"><b>${esc(me.display_name)}</b><div class="small">@${esc(me.username)}</div></div><button class="btn secondary" onclick="logout()">خروج</button>`}
async function loadChats(){const d=await api('/api/chats');$('chatList').innerHTML=d.chats.map(c=>`<button class="chat ${currentChat===c.id?'active':''}" onclick="openChat('${c.id}')">${esc(c.title)}</button>`).join('');if(!currentChat&&d.chats[0])await openChat(d.chats[0].id)}
async function newChat(){const d=await api('/api/chats',{method:'POST',body:'{}'});currentChat=d.chat.id;$('messages').innerHTML='';await loadChats()}
async function openChat(id){const d=await api('/api/chats/'+id);currentChat=id;$('messages').innerHTML=d.messages.map(m=>`<div class="msg ${m.role==='user'?'user':'assistant'}">${esc(m.content)}</div>`).join('');$('messages').scrollTop=$('messages').scrollHeight;await loadChats()}
async function send(){if(!currentChat){await newChat()}const i=$('input'),text=i.value.trim();if(!text)return;i.value='';add('user',text);const loading=add('assistant','جاري تحليل الطلب…');try{const d=await api('/api/chats/'+currentChat+'/message',{method:'POST',body:JSON.stringify({content:text})});loading.remove();add('assistant',d.message+(d.job?'\n\n⌛ المهمة في قائمة Agent وتنتظر التنفيذ.':''));if(d.job)watchJob(d.job.id)}catch(e){loading.remove();add('assistant','حدث خطأ: '+e.message)}}
function add(role,text){const x=document.createElement('div');x.className='msg '+role;x.textContent=text;$('messages').appendChild(x);$('messages').scrollTop=$('messages').scrollHeight;return x}
async function watchJob(id){clearInterval(jobTimer);jobTimer=setInterval(async()=>{try{const d=await api('/api/jobs/'+id);if(d.job.status==='success'||d.job.status==='failed'){clearInterval(jobTimer);add('assistant',d.job.status==='success'?'✓ Agent أكد نجاح التنفيذ.':'✕ Agent أبلغ عن فشل التنفيذ.')}}catch(_){clearInterval(jobTimer)}},2500)}
async function statusLoop(){const tick=async()=>{try{const d=await api('/api/agent/status?project_id=main-project');$('dot').className='dot '+(d.online?'ok':'');$('agentStatus').textContent=d.online?'Agent متصل بالمشروع':'Agent غير متصل'}catch(_){}};await tick();setInterval(tick,5000)}
async function logout(){await api('/auth/logout',{method:'POST'});location.reload()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}boot();
</script></body></html>
