<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haroon AI Agent</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#eef1f7;font-family:system-ui,Arial}.app{height:100vh;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid #242a35;background:#0e1118;display:flex;align-items:center;padding:0 18px;gap:10px}.logo{font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:#53d769}.layout{flex:1;display:flex;min-height:0}.side{width:255px;background:#0d1016;border-left:1px solid #222834;padding:12px}.new{width:100%;padding:11px;border:1px solid #303746;border-radius:10px;background:#171b23;color:#fff}.chat{padding:10px;margin-top:8px;border-radius:9px;color:#c5cad5}.chat.active{background:#181d27}.main{flex:1;display:flex;flex-direction:column;min-width:0}#feed{flex:1;overflow:auto;padding:26px 7%;display:flex;flex-direction:column;gap:18px}.msg{max-width:920px;width:100%;margin:auto}.who{font-size:12px;color:#8e98aa;margin-bottom:6px}.bubble{white-space:pre-wrap;line-height:1.75}.user .bubble{background:#171c25;border:1px solid #29303c;border-radius:13px;padding:12px}.activity{margin-top:10px;border:1px solid #2a313e;background:#10141b;border-radius:12px;padding:10px}.step{padding:8px;border-bottom:1px solid #222834;font-size:13px}.ok{color:#7ee787}.composer{border-top:1px solid #242a35;padding:14px 7% 18px}.box{max-width:920px;margin:auto;display:flex;gap:8px;background:#151922;border:1px solid #303746;border-radius:14px;padding:8px}textarea{flex:1;background:transparent;border:0;outline:0;color:white;font:inherit;resize:none;padding:8px;min-height:44px}.send{width:48px;border:0;border-radius:10px;background:#6557ff;color:white;font-size:20px}@media(max-width:760px){.side{display:none}#feed,.composer{padding-left:12px;padding-right:12px}}</style></head><body><div class="app"><div class="top"><div class="logo">⚡ Haroon AI Agent</div><div class="dot"></div><small>متصل</small></div><div class="layout"><aside class="side"><button class="new" id="new">＋ محادثة جديدة</button><div class="chat active">مشروع Roblox الحالي</div></aside><main class="main"><div id="feed"></div><div class="composer"><div class="box"><textarea id="input" placeholder="ماذا تريد أن أبني أو أعدل؟"></textarea><button class="send" id="send">↑</button></div></div></main></div></div><script>const f=document.getElementById('feed'),i=document.getElementById('input'),s=document.getElementById('send');function add(w,t,c=''){let x=document.createElement('div');x.className='msg '+c;x.innerHTML='<div class="who"></div><div class="bubble"></div>';x.querySelector('.who').textContent=w;x.querySelector('.bubble').textContent=t;f.appendChild(x);f.scrollTop=f.scrollHeight;return x}async function ask(){let t=i.value.trim();if(!t)return;i.value='';add('أنت',t,'user');s.disabled=true;let out=add('Haroon AI','أحلل طلبك...');try{let r=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})}),d=await r.json();if(!r.ok)throw Error(d.error);out.querySelector('.bubble').textContent=d.plan.summary||'تم إنشاء خطة';if(d.plan.kind==='build'){let a=document.createElement('div');a.className='activity';for(const st of d.plan.steps||[]){let q=document.createElement('div');q.className='step ok';q.textContent='✓ '+(st.title||st.operation);a.appendChild(q)}out.appendChild(a)}}catch(e){out.querySelector('.bubble').textContent='حدث خطأ: '+e.message}finally{s.disabled=false}}s.onclick=ask;i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});add('Haroon AI','مرحبًا 👋 اكتب ما تريد بناءه أو تعديله.');</script></body></html>
